<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f5f0">
<script>
(function(){var theme='light';try{if(localStorage.getItem('fg-theme')==='dark')theme='dark';}catch(e){}document.documentElement.dataset.theme=theme;document.querySelector('meta[name="theme-color"]').content=theme==='dark'?'#0b0b0c':'#f6f5f0';})();
</script>
