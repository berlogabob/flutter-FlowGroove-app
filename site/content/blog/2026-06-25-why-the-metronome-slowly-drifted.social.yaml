  caption: "Why the metronome slowly drifted \u2014 and the 50-line fix \U0001F941\
    \n\nThe FlowGroove metronome used to slide off the beat over a long song. Not\
    \ by much \u2014 but by the last chorus of a five-minute tune you could feel it,\
    \ exactly when you need the click most.\n\nThe culprit: a periodic timer that\
    \ re-armed relative to when the last tick actually fired. Every few milliseconds\
    \ of lateness carried into the next interval, and it quietly piled up.\n\nThe\
    \ fix: anchor every tick to a monotonic clock with an absolute target per tick,\
    \ and schedule \"target minus now\". Jitter gets corrected on the spot instead\
    \ of compounding. About 50 lines, standard library only, no new dependency.\n\n\
    A metronome that can't hold time is worse than no metronome, because you trust\
    \ it and it lies to you. It just stays in time now. Link in bio \U0001F3B8\n.\n\
