telegram:
  text: "\U0001F941 Why the metronome slowly drifted \u2014 and the 50-line fix\n\n\
    The FlowGroove metronome used to slide off the beat over a long song. The culprit:\
    \ a periodic timer that re-armed relative to when the last tick actually fired\
    \ \u2014 so every few milliseconds of lateness carried into the next interval\
    \ and quietly piled up.\n\nThe fix: anchor every tick to a monotonic clock. A\
    \ wall-clock scheduler tracks an absolute target per tick (nextTarget += interval)\
    \ and schedules \"target minus now\", so jitter gets corrected on the spot instead\
    \ of compounding.\n\n~50 lines of pure Dart, no new dependency. A metronome that\
    \ can't hold time is worse than none \u2014 you trust it and it lies to you \u2192\
    \ https://flowgroove.app/blog/why-the-metronome-slowly-drifted/"
