  caption: "One codebase, three screens \U0001F6E0\n\nThe first real decision in FlowGroove wasn't a feature — it was betting that one codebase could run on web, Android and iOS at once.\n\nThe band's gear is mixed: my phone, the guitarist's tablet, the drummer's laptop. It all had to look the same. And a solo dev maintaining three separate native apps is a solo dev who ships nothing.\n\nSo: one Dart codebase with Flutter, Firebase handling the sync. Every feature since is downstream of that one math problem.\n\nFull devlog — link in bio \U0001F3B8\n.\n.\n#coverband #bandlife #musicianlife #setlist #livemusic #musictech #indiedev #buildinpublic #flutter #opensource #musicians"
