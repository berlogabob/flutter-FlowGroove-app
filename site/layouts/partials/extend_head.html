{{/* FlowGroove emits its pre-paint palette in theme-head; keep rollback compatible. */}}
{{ if not (templates.Exists "partials/theme-head.html") }}
<meta name="color-scheme" content="{{ site.Params.defaultTheme | default "light dark" }}">
<meta name="theme-color" content="{{ if eq site.Params.defaultTheme "dark" }}#0b0b0c{{ else }}#f6f5f0{{ end }}">
{{ end }}
{{ partial "seo.html" . }}
{{ partial "analytics.html" . }}
