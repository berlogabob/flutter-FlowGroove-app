<!doctype html>
<html>
    <head>
        <!-- Base href for GitHub Pages -->
        <base href="$FLUTTER_BASE_HREF" />

        <meta charset="UTF-8" />
        <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
        <meta name="description" content="FlowGroove - Band Repertoire Manager" />
        <!-- Link preview in messengers and social networks -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="FlowGroove" />
        <meta property="og:title" content="FlowGroove - your shared setlist notebook" />
        <meta property="og:description" content="Songs, keys, tempos and notes, ready for every rehearsal." />
        <meta property="og:image" content="https://flowgroove.app/images/og-cover.jpg" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:image" content="https://flowgroove.app/images/og-cover.jpg" />

        <!-- iOS meta tags & icons -->
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black" />
        <meta name="apple-mobile-web-app-title" content="FlowGroove" />
        <link rel="apple-touch-icon" href="icons/Icon-192.png" />

        <!-- Favicon -->
        <link rel="icon" type="image/png" href="favicon.png" />

        <title>FlowGroove</title>
        <link rel="manifest" href="manifest.json" />

        <!-- Load runtime configuration BEFORE Flutter bootstrap -->
        <!-- This file is injected at build time with environment variables -->
        <script src="config.js"></script>
        <!-- MP3 encoder for sharing recordings (LGPL). Kept as a separate,
             unmodified file on purpose — see web/vendor/README.md. -->
        <script src="vendor/lamejs.iife.js"></script>
    </head>
    <body>
        <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
        <script src="flutter_bootstrap.js" async></script>
    </body>
</html>
