<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0;url=https://app.flowgroove.app/">
<title>FlowGroove - Redirecting</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #1a1a1a; color: #e0e0e0; }
  .container { text-align: center; max-width: 600px; padding: 2rem; }
  h1 { font-size: 1.5rem; margin-bottom: 1rem; }
  p { margin-bottom: 1.5rem; line-height: 1.6; }
  a { color: #4a9eff; text-decoration: none; font-weight: 500; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
<script>
location.replace("https://app.flowgroove.app/" + location.search + location.hash);
</script>
<div class="container">
  <h1>FlowGroove has moved</h1>
  <p>We've moved the app to a new home. If you're not redirected automatically, <a href="https://app.flowgroove.app/">click here</a>.</p>
</div>
</body>
</html>
