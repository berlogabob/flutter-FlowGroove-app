# GitHub Actions Workflow for Test Deployment (GitHub Pages)
# ============================================================
#
# This workflow deploys the test build to GitHub Pages on every push to second01 branch
#
# NO SECRETS REQUIRED! Uses demo configuration (Firebase works, Spotify disabled)

name: Deploy Test (GitHub Pages)

on:
  push:
    branches:
      - second01
  workflow_dispatch:  # Allow manual trigger

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy-test:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.41.x'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Use demo configuration
        run: |
          echo "🔧 Using demo configuration"
          cp web/config.demo.js web/config.js

      - name: Build web app
        run: flutter build web --release --base-href "/flutter-FlowGroove-app/"

      - name: Copy config.js to build (force, ignoring .gitignore)
        run: cp web/config.js build/web/config.js

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          force_orphan: true
          full_commit_message: 'Deploy test build ${{ github.sha }}'
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

      - name: Deployment summary
        run: |
          echo "✅ Deployment complete!"
          echo "🌐 Test URL: https://berlogabob.github.io/flutter-FlowGroove-app/"
