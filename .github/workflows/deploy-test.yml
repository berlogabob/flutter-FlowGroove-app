# GitHub Actions Workflow for Test Deployment (GitHub Pages)
# ============================================================
#
# This workflow deploys the test build to GitHub Pages on every push to second01 branch
#
# NO SECRETS REQUIRED! Uses demo configuration (Firebase works, Spotify disabled)
#
# To add Spotify/Twitter credentials later:
# 1. Set secrets in GitHub Repository Settings > Secrets and variables > Actions
# 2. Update the "Generate web configuration" step to use generate-web-config.sh

name: Deploy Test (GitHub Pages)

on:
  push:
    branches:
      - second01
  workflow_dispatch:  # Allow manual trigger

# Cancel in-progress runs if new push occurs
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy-test:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to push to gh-pages branch

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for version info

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.41.x'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Use demo configuration (no credentials needed)
        run: |
          echo "🔧 Using demo configuration for GitHub Pages"
          echo "   (Firebase works, Spotify/Twitter disabled)"
          cp web/config.demo.js web/config.js

      - name: Build web app
        run: flutter build web --release --base-href "/flutter-FlowGroove-app/"

      - name: Copy config to build
        run: cp web/config.js build/web/config.js

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          destination_dir: .  # Deploy to root of gh-pages branch
          keep_files: false   # Clear previous deployment
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy test build ${{ github.sha }}'

      - name: Deployment summary
        run: |
          echo "✅ Deployment complete!"
          echo "🌐 Test URL: https://berlogabob.github.io/flutter-FlowGroove-app/"
          echo "⏱️  GitHub Pages build: 1-2 minutes"
