name: GitHub Pages And Android APK

# Rapid pushes (release + docs deploy) superseded each other's runs; keep only
# the latest per ref instead of queueing all of them.
concurrency:
  group: pages-android-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - second01
    tags:
      - 'v*'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Android APK build + release attach. Intentionally has NO `environment:` so
  # tag pushes can run it — the `github-pages` environment's branch policy
  # rejects tag refs, which previously failed the whole job in ~3s before any
  # step ran.
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      # Build a .env that the mobile build script will prefer over the committed
      # demo config. Missing secrets are written empty and are treated as
      # "not configured" by the build script (feature stays disabled). The
      # Firebase API key falls back to the public project key when no secret is
      # set, so the build never hard-fails. This file is never committed.
      - name: Create .env from secrets
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_PROXY_URL: ${{ secrets.SPOTIFY_PROXY_URL }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          cat > .env <<EOF
          FIREBASE_API_KEY=${FIREBASE_API_KEY:-AIzaSyAxQ53DQzyEkKXjo3Ry2B9pcTMvcyk4d5o}
          SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
          SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
          SPOTIFY_PROXY_URL=${SPOTIFY_PROXY_URL}
          TWITTER_API_KEY=${TWITTER_API_KEY}
          TWITTER_API_SECRET=${TWITTER_API_SECRET}
          TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
          EOF
          echo "Wrote .env (values masked by GitHub Actions)."

      # Decode the release keystore and write android/key.properties when the
      # signing secrets are present. When they are absent the build falls back to
      # debug signing (see android/app/build.gradle.kts).
      - name: Configure release signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret set — skipping APK publish to"
            echo "avoid attaching a randomly-signed (debug) APK that breaks updates."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          cat > android/key.properties <<EOF
          storeFile=release.keystore
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF
          echo "Release signing configured with upload keystore."
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      # Only build/publish the APK when the stable upload keystore is available.
      # Without it the APK would be signed with an ephemeral per-run debug key,
      # producing a new signature every release (Obtainium "Conflict").
      - name: Build Android APK
        if: steps.signing.outputs.enabled == 'true'
        run: make build-android

      - name: Upload Android APK artifact
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: flowgroove-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: steps.signing.outputs.enabled == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes "FlowGroove $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" \
            build/app/outputs/flutter-apk/app-release.apk#flowgroove-android.apk \
            --clobber

  # GitHub Pages deploy. Keeps the `github-pages` environment, so it only runs on
  # the branches allowed by that environment's policy (never on tags).
  pages:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
          extended: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build GitHub Pages site
        run: make -f Makefile.hugo hugo-build app-build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
