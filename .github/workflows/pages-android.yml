name: Android APK (release)

# Rapid pushes (release + docs deploy) superseded each other's runs; keep only
# the latest per ref instead of queueing all of them.
# NOTE: exactly ONE top-level `concurrency:` key. A duplicate block here made
# GitHub reject the whole file — every run failed instantly with 0 jobs.
concurrency:
  group: pages-android-${{ github.ref }}
  cancel-in-progress: true

# Release tags only. Branch pushes used to trigger this too, which meant a
# second (redundant) run alongside Checks on every commit — and the web/Pages
# build here duplicated `make deploy-pages`, which is the real publishing path.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Android APK build + release attach. Intentionally has NO `environment:` so
  # tag pushes can run it — the `github-pages` environment's branch policy
  # rejects tag refs, which previously failed the whole job in ~3s before any
  # step ran.
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      # Build a .env that the mobile build script will prefer over the committed
      # demo config. Missing secrets are written empty and are treated as
      # "not configured" by the build script (feature stays disabled). The
      # Firebase API key falls back to the public project key when no secret is
      # set, so the build never hard-fails. This file is never committed.
      - name: Create .env from secrets
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_PROXY_URL: ${{ secrets.SPOTIFY_PROXY_URL }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          cat > .env <<EOF
          FIREBASE_API_KEY=${FIREBASE_API_KEY:-AIzaSyAxQ53DQzyEkKXjo3Ry2B9pcTMvcyk4d5o}
          SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
          SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
          SPOTIFY_PROXY_URL=${SPOTIFY_PROXY_URL}
          TWITTER_API_KEY=${TWITTER_API_KEY}
          TWITTER_API_SECRET=${TWITTER_API_SECRET}
          TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
          EOF
          echo "Wrote .env (values masked by GitHub Actions)."

      # Decode the release keystore and write android/key.properties when the
      # signing secrets are present. When they are absent the build falls back to
      # debug signing (see android/app/build.gradle.kts).
      - name: Configure release signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret set — skipping APK publish to"
            echo "avoid attaching a randomly-signed (debug) APK that breaks updates."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          cat > android/key.properties <<EOF
          storeFile=release.keystore
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF
          echo "Release signing configured with upload keystore."
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      # Only build/publish the APK when the stable upload keystore is available.
      # Without it the APK would be signed with an ephemeral per-run debug key,
      # producing a new signature every release (Obtainium "Conflict").
      - name: Build Android APK
        if: steps.signing.outputs.enabled == 'true'
        run: make build-android

      - name: Upload Android APK artifact
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: flowgroove-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: steps.signing.outputs.enabled == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes "FlowGroove $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" \
            build/app/outputs/flutter-apk/app-release.apk#flowgroove-android.apk \
            --clobber

# The GitHub Pages job that used to live here was removed: it published via
# actions/deploy-pages, which needs Pages source = "GitHub Actions", but this
# repo's Pages source is branch second01 /docs (served by the built-in
# pages-build-deployment run). `make deploy-pages` builds docs/ and pushes it —
# that is the real publishing path. Two publishers fighting over one site is the
# "github.io blank page" failure mode; don't reintroduce it without switching
# the Pages source first.
