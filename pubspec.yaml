name: flowgroove
description: "FlowGroove - Band repertoire management for cover bands"
publish_to: "none"
version: 0.20.0+352

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase (Updated to latest stable)
  cloud_firestore: ^6.1.3
  cloud_functions: ^6.3.1
  firebase_auth: ^6.2.0
  firebase_core: ^4.5.0
  firebase_analytics: ^12.1.3
  firebase_storage: ^13.1.0

  # Google Sign-In (social auth)
  google_sign_in: ^7.2.0
  # Direct dep only to import web_only.dart (renderButton) on web.
  google_sign_in_web: ^1.1.3

  # State Management (Updated)
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3

  # Offline & Storage (Updated - considering migration to Isar)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^10.0.0

  # Connectivity
  connectivity_plus: ^7.0.0

  # Wakelock (Phase 2.2)
  # Pinned: 1.7.0 ships Android sources whose root-package `import IsEnabledMessage`
  # / `import ToggleMessage` fail to compile under Kotlin 2.2.20
  # (:wakelock_plus:compileReleaseKotlin — Unresolved reference). Hold the last
  # known-good release until a fixed one lands.
  wakelock_plus: 1.6.1

  # Navigation
  go_router: ^17.1.0

  # UI Utilities
  google_fonts: ^8.1.0

  # Audio
  flutter_soloud: ^4.0.9
  record: ^7.1.0
  # Tuner: iOS measurement-mode session (disables voice processing during capture)
  audio_session: ^0.2.4
  just_audio: ^0.10.0

  # PDF & Export
  pdf: ^3.11.2
  printing: ^5.14.2

  # Utilities
  cupertino_icons: ^1.0.8
  http: ^1.4.0
  intl: ^0.20.2
  json_annotation: ^4.11.0
  package_info_plus: ^10.1.0
  url_launcher: ^6.3.2
  flutter_markdown_plus: ^1.0.0
  uuid: ^4.5.3
  equatable: ^2.0.7

  # CSV processing
  csv: ^8.0.0

  # Image picking
  image_picker: ^1.1.2

  # File picker for import/export
  # Pinned: 12.0.0-beta.7 ships broken Android sources (unresolved FileUtils);
  # keep the last known-good beta until a fixed release lands.
  file_picker: 12.0.0-beta.5
  share_plus: ^13.1.0

  permission_handler: ^12.0.1

  web: ^1.1.1

  path_provider: any
  cached_network_image: ^3.4.1

  # QR codes for band invite sharing
  qr_flutter: ^4.1.0
dev_dependencies:
  build_runner: ^2.12.2
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  json_serializable: ^6.13.0
  mockito: ^5.6.3
  mocktail: ^1.0.0
  just_audio_platform_interface: ^4.6.0
  riverpod_generator: ^4.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/data/
    - assets/logo_clean.png
    - assets/google_logo.png
    - site/content/wiki/
